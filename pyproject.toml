[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer3d"
version = "0.1.0"
description = "Resin slicer for the Phrozen Sonic Mini 8K and Anycubic Photon Mono M5s Pro"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "trimesh>=4.0", "pillow>=10.0", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
slicer3d = "slicer3d.cli:main"

[tool.setuptools]
packages = ["slicer3d", "slicer3d.formats"]
